    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    <!-- Fraunces: organic variable display serif (SOFT + WONK axes drive the natural, grown-not-drawn feel) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&display=swap" rel="stylesheet">
    <!-- Cinzel: Roman inscriptional capitals — the letterform actually used
         for carving into stone. Drives the stone-sign heading. -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    <!-- Baloo 2 ExtraBold: ultra-fat strokes with fully ROUNDED terminals,
         matching the 3D grass-letter reference. Round ends matter — a flat
         terminal reads as cut, a round one reads as a grown clump. -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap" rel="stylesheet">

    <!-- Grass texture for the hero headline fill: preloaded so the title
         doesn't flash solid green before the texture lands -->
